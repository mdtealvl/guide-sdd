name: release
# On tag vX.Y.Z: verify the version stamps agree with the tag, run the smoke test, build the
# START_HERE zip (sdd/ prefix, no framework-repo-only files), and publish a GitHub Release whose
# notes are the matching constitution.changelog.md section.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version stamps match the tag
        run: sh ci/version_check.sh "${GITHUB_REF_NAME#v}"
      - name: Smoke test
        run: sh ci/smoke.sh --compare
      - name: Build zip + checksum + notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist/sdd
          rsync -a ./ dist/sdd/ \
            --exclude .git --exclude .github/workflows --exclude ci --exclude dist \
            --exclude plugin --exclude .claude-plugin --exclude .claude \
            --exclude project-config/PROPOSED_CHANGELOG.md
          (cd dist && zip -qr "guide-sdd-$VER.zip" sdd && sha256sum "guide-sdd-$VER.zip" > "guide-sdd-$VER.zip.sha256")
          awk -v v="$GITHUB_REF_NAME" '
            index($0, "## " v " ") == 1 || $0 == "## " v { f = 1; print; next }
            f && /^## / { exit }
            f { print }' constitution.changelog.md > dist/notes.md
          [ -s dist/notes.md ] || printf 'GUIDE SDD %s\n' "$GITHUB_REF_NAME" > dist/notes.md
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/guide-sdd-*.zip dist/guide-sdd-*.zip.sha256 \
            --title "GUIDE SDD $GITHUB_REF_NAME" --notes-file dist/notes.md
