name: ci
# GUIDE SDD framework CI: the INIT §6 smoke test on both gate families, plus ps1/sh parity and
# version consistency. No Python; jq + pwsh only.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke-ubuntu:
    name: sh gates + ps1 parity (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency
        run: sh ci/version_check.sh
      - name: Smoke test (sh gates, ps1 twins compared)
        run: sh ci/smoke.sh --compare
      - name: Persona guard hook unit test
        run: sh ci/hook_test.sh
      - name: Installer test (update check + careful merge, sh and ps1 twins, byte parity)
        run: sh ci/install_test.sh both
      - name: Spine self-lint (constitution_lint over the framework's own conventions, strict)
        run: sh gates/constitution_lint.template.sh --config ci/spine.gates.config.json
      - name: Spine prose self-check (strict — the spine passes its own spec-form gate since v1.15.0)
        run: sh gates/prose_check.sh --config ci/spine.gates.config.json --all --report --strict
      - name: Plugin bin copies match the root installers
        run: cmp install.sh plugin/bin/install.sh && cmp install.ps1 plugin/bin/install.ps1
      - name: Plugin + marketplace manifests validate
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1
          claude plugin validate ./plugin --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
  smoke-windows:
    name: ps1 gates (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test (ps1 gates)
        shell: pwsh
        run: pwsh ci/smoke.ps1
      - name: Spine self-lint (ps1 rule engine on real rules)
        shell: pwsh
        run: pwsh gates/constitution_lint.template.ps1 -Config ci/spine.gates.config.json
      - name: Installer test (ps1 twin on Windows)
        shell: bash
        run: sh ci/install_test.sh ps1
