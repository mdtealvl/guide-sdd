name: ci
# GUIDE SDD framework CI: the INIT §6 smoke test on both gate families, plus ps1/sh parity and
# version consistency. No Python; jq + pwsh only.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke-ubuntu:
    name: sh gates + ps1 parity (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency
        run: sh ci/version_check.sh
      - name: Smoke test (sh gates, ps1 twins compared)
        run: sh ci/smoke.sh --compare
      - name: Persona guard hook unit test
        run: sh ci/hook_test.sh
      - name: Spine prose self-check (warn only — the spine fails its own spec-form gate; tracked in SDD-PROP-11)
        run: |
          jq '.paths.spec = "**/*.md" | .proseCheck.mode = "warn" | .proseCheck.excludeGlobs = ["README.md","constitution.changelog.md","project-config/PROPOSED_CHANGELOG.md","website/**","plugin/**"]' \
            gates/gates.config.template.json > /tmp/spine-prose.json
          sh gates/prose_check.sh --config /tmp/spine-prose.json --all --report || true
      - name: Plugin bin copies match the root installers
        run: cmp install.sh plugin/bin/install.sh && cmp install.ps1 plugin/bin/install.ps1
      - name: Plugin + marketplace manifests validate
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1
          claude plugin validate ./plugin --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
  smoke-windows:
    name: ps1 gates (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test (ps1 gates)
        shell: pwsh
        run: pwsh ci/smoke.ps1
